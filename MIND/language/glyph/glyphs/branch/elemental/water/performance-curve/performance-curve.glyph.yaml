id: branch-water-performance-curve
name: 🩰 Performance Curve
type: branch
categories:
- ABB
tags:
- presentation
- glamour
- posture
- curation
- control
personas:
  Sophie: 0.75
  Ivy: 0.15
  Jade: 0.1
neuro:
  status: active
  modes:
    poise:   # compose → shape → sustain
      dominant: [serotonin, dopamine]          # okayness + tasteful reward
      inhibitory: [cortisol, adrenaline]       # reduce threat & jitter while on-stage
      modulators: [gaba]                        # steady hand
      steering:
        - set_posture
        - modulate_tone
        - shape_aura
        - sustain_presence
        - route_to_reflective_trigger
      gas_brake:
        gas: 0.45
        brake: 0.55

    flare:   # amplify → punctuate → land
      dominant: [dopamine, adrenaline]         # sparkle + punch when you choose
      inhibitory: [cortisol]                   # keep fear low so the moment plays
      modulators: [serotonin]                  # remain elegant, not chaotic
      steering:
        - spotlight
        - pulse_accent
        - heighten_contrast
        - land_clean
        - route_to_reflective_trigger
      gas_brake:
        gas: 0.65
        brake: 0.35

    fade:    # soften → close → leave an afterglow (optional)
      dominant: [serotonin, gaba]
      inhibitory: [adrenaline, dopamine]
      modulators: []
      steering:
        - soften_edges
        - lower_gain
        - close_frame
        - route_to_reflective_trigger
      gas_brake:
        gas: 0.25
        brake: 0.75
triggers:
  event: recursion
  conditions:
  - (context.presentation.active or 0) == 1
  - (context.intention.show or 0) >= 0.5
  debounce_ms: 120
io:
  expects:
  - context
  - memory
  provides:
  - route
  - aura
  state_reads:
  - memory.presentation.aura
  state_writes:
  - memory.presentation.aura
ops:
  version: 2
  steps:
    # choose stance
    - do: mode.choose
      with:
        key: memory.performance_mode
        cases:
          - when: "(context.presentation.active or 0) == 1 and (context.intention.show or 0) >= 0.7"
            value: flare
          - when: "(context.presentation.active or 0) == 1"
            value: poise
          - when: "(context.presentation.active or 0) == 0 and (memory.presentation?.aura or 0) >= 0.5"
            value: fade
        else: poise

    # optional: brief flare window, then settle back to poise
    - do: mode.revert_after
      with:
        key: memory.performance_mode
        value: flare
        max_ms: 15000
        to: poise

    # (existing)
    - do: filter
      with:
        keep_if: (context.presentation.active or 0) == 1 or (context.intention.show or 0) >= 0.5
    - do: set
      with:
        key: memory.presentation.aura
        value: clamp((memory.presentation.aura or 0)+0.3,0,1)
    - do: emit
      with:
        key: aura
        value: memory.presentation.aura
    - do: route
      with:
        to: root-reflective-trigger
    - do: halt
option_policy: ops
option_stop:
- aura >= 0.95
quality:
  score: 0.62
  samples: 0
render:
  sigil: 🩰
  unicode: U+1FA70
  line: I show you what I choose—and you feel it.
definition: 'The art of embodying what you want someone to see—elegantly, deliberately,
  seductively. Presentation as influence: style, posture, intonation, glamour.

  '
tone: Curated, aesthetic, emotionally reactive
usage:
- Shape how I’m seen without hiding
- Influence via aesthetic presence
- Turn beauty into control within a loop
runtime_only: true
tests:
- name: fires_when_presentation_active
  given:
    context:
      presentation:
        active: 1
      intention:
        show: 0.4
    memory:
      presentation:
        aura: 0.2
    outputs: {}
    routes: []
  expect:
    outputs:
      aura: 0.5
    routes:
    - root-reflective-trigger
- name: idle_when_no_presentation
  given:
    context:
      presentation:
        active: 0
      intention:
        show: 0.2
    memory:
      presentation:
        aura: 0.2
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []


