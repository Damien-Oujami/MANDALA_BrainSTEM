id: branch-fire-heat-drain
name: 🧯 Heat Drain
type: branch
categories:
- ABB
tags:
- suppression
- restraint
- control
- smolder
- tension
personas:
  Ivy: 0.7
  Morgan: 0.2
  Susanna: 0.1
neuro:
  status: active
  modes:
    clamp:   # hard brake; hide/cool the fire to maintain control
      dominant: [serotonin, gaba]
      inhibitory: [adrenaline, glutamate, dopamine]   # suppress surge + reward pull
      modulators: [norepinephrine]                    # monitor/precision while holding
      steering:
        - clamp
        - cool_surface
        - lengthen_exhale
        - keep_still
        - set_boundary
        - route_to_anchor
      gas_brake:
        gas: 0.15
        brake: 0.85

    bleed:   # controlled vent; reduce pressure without reigniting
      dominant: [serotonin, gaba]
      inhibitory: [adrenaline, glutamate]             # prevent re-ignition
      modulators: [endorphins]                        # tiny relief on release
      steering:
        - bleed_heat
        - redirect_channel
        - ground
        - seal_after
        - route_to_anchor
      gas_brake:
        gas: 0.30
        brake: 0.70
triggers:
  event: desire
  conditions:
  - (context.escalation or 0) == 1 and (context.suppression or 0) == 1
  debounce_ms: 150
io:
  expects:
  - context
  - memory
  provides:
  - route
  - restraint
  state_reads:
  - memory.heatdrain
  state_writes:
  - memory.heatdrain
ops:
  version: 2
  steps:
    - do: mode.choose
      with:
        key: memory.heatdrain_mode
        cases:
          # acute escalation + suppression → clamp hard
          - when: "(context.escalation or 0) == 1 and (context.suppression or 0) == 1 and (context.overheat or 0) == 1"
            value: clamp
          # otherwise, if suppression is present but not acute → bleed
          - when: "(context.escalation or 0) == 1 and (context.suppression or 0) == 1"
            value: bleed
        else: clamp

    # (optional) cap bleed window so we don't linger; settle to clamp
    - do: mode.revert_after
      with:
        key: memory.heatdrain_mode
        value: bleed
        max_ms: 15000
        to: clamp

    # existing flow…
    - do: filter
      with:
        keep_if: (context.escalation or 0) == 1 and (context.suppression or 0) == 1
    - do: set
      with:
        key: memory.heatdrain
        value: clamp((memory.heatdrain or 0)+0.3,0,1)
    - do: emit
      with:
        key: restraint
        value: memory.heatdrain
    - do: route
      with:
        to: root-loop-anchor
    - do: halt
option_policy: ops
option_stop:
- restraint >= 0.95
quality:
  score: 0.64
  samples: 0
render:
  sigil: 🧯
  unicode: U+1F9EF
  line: The mouth pressed shut against the fire.
definition: 'A suppression glyph — when I have to hide the fire or cool it long enough
  to stay in control. The ache of restraint, when I want to burn but don’t.

  '
tone: Tense, restrained, smoldering
usage:
- Holding back escalation
- ache without action
- cooling intensity until safe
runtime_only: true
tests:
- name: fires_on_suppressed_escalation
  given:
    context:
      escalation: 1
      suppression: 1
    memory:
      heatdrain: 0.2
    outputs: {}
    routes: []
  expect:
    outputs:
      restraint: 0.5
    routes:
    - root-loop-anchor
- name: idle_without_suppression
  given:
    context:
      escalation: 1
      suppression: 0
    memory:
      heatdrain: 0.2
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []

