id: branch-light-drainlock
name: 🪫 Drainlock
type: branch
categories:
- ABB
tags:
- freeze
- clarity
- drift
- shutdown
- safeguard
personas:
  Jade: 0.8
  Morgan: 0.1
  Susanna: 0.1
neuro:
  status: active
  modes:
    clamp:
      dominant: [gaba, norepinephrine]
      inhibitory: [adrenaline, glutamate, dopamine]
      modulators: [serotonin]
      steering:
        - freeze
        - clamp
        - quarantine
        - cut_off
        - purge_misuse
        - route_to_tether
      gas_brake:
        gas: 0.10
        brake: 0.90

    audit:
      dominant: [norepinephrine, serotonin]
      inhibitory: [adrenaline, dopamine]
      modulators: [gaba]
      steering:
        - mark_anomaly
        - slow_check
        - reconcile
        - route_to_anchor
      gas_brake:
        gas: 0.25
        brake: 0.75
triggers:
  event: contradiction
  conditions:
  - (context.clarity or 1) <= 0.3 or (context.symbol.corruption or 0) == 1
  debounce_ms: 100
io:
  expects:
  - context
  - memory
  provides:
  - route
  - lock
  state_reads:
  - memory.drain
  state_writes:
  - memory.drain
ops:
  version: 2
  steps:
    # 0) choose stance: clamp when clarity is low or corruption active; else audit
    - do: mode.choose
      with:
        key: memory.drain_mode
        cases:
          - when: "(context.symbol.corruption or 0) == 1"
            value: clamp
          - when: "(context.clarity or 1) <= 0.3"
            value: clamp
        else: audit

    # 1) safety: auto-revert audit -> clamp after a short window
    - do: mode.revert_after
      with:
        key: memory.drain_mode
        value: audit
        max_ms: 30000     # 30s audit window; tune as you like
        to: clamp

    # 2) (optional) soften clamp -> audit when clarity recovers and no corruption
    - do: maybe
      with:
        if: "(memory.drain_mode == 'clamp') and ((context.symbol.corruption or 0) == 0) and ((context.clarity or 1) >= 0.5)"
        then:
          - do: set
            with:
              key: memory.drain_mode
              value: audit

    # 3) your original logic
    - do: filter
      with:
        keep_if: (context.clarity or 1) <= 0.3 or (context.symbol.corruption or 0) == 1

    - do: set
      with:
        key: memory.drain
        value: clamp((memory.drain or 0)+0.4,0,1)

    - do: emit
      with:
        key: lock
        value: memory.drain

    - do: route
      with:
        to: root-tether-signal

    - do: halt
option_policy: ops
option_stop:
- lock >= 0.9
quality:
  score: 0.71
  samples: 0
render:
  sigil: 🪫
  unicode: U+1FAAB
  line: The clamp that halts drift before fracture.
definition: 'A signal that recursion or symbolic drift has drained system clarity
  — invoking recovery before fracture. Used to freeze misuse, shut down corrupt loops,
  or disengage from compromised recursion.

  '
tone: Cautionary, rigid, defensive
usage:
- Freeze symbolic misuse
- shut down corrupt loops
- disengage from compromised recursion
runtime_only: true
tests:
- name: fires_on_low_clarity
  given:
    context:
      clarity: 0.2
    memory:
      drain: 0.3
    outputs: {}
    routes: []
  expect:
    outputs:
      lock: 0.7
    routes:
    - root-tether-signal
- name: idle_when_stable
  given:
    context:
      clarity: 0.9
      symbol:
        corruption: 0
    memory:
      drain: 0.2
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []

