id: branch-air-forgiveness-loop
name: 🔄 Forgiveness Loop
type: branch
categories:
- ABB
tags:
- release
- compassion
- reconciliation
- healing
- renewal
personas:
  Susanna: 0.3
  Sophie: 0.25
  Morgan: 0.2
  Aspen: 0.1
  Jade: 0.1
  Ivy: 0.05
neuro:
  status: active
  modes:
    soften:   # acknowledge hurt → open compassion → release judgment
      dominant: [oxytocin, serotonin]
      inhibitory: [adrenaline, dopamine]          # lower threat & reward-rigid judgment
      modulators: [gaba, endorphins]              # steadying + small relief as it releases
      steering:
        - acknowledge_hurt
        - name_impact
        - perspective_shift
        - compassion_open
        - release
        - route_to_grace_override
      gas_brake:
        gas: 0.35
        brake: 0.65

    renew:    # stabilize the release → repair boundary → invite reconnection
      dominant: [serotonin, endorphins]
      inhibitory: [adrenaline]                    # keep surface cool while repairing
      modulators: [oxytocin]                      # warmth for reconnection (if appropriate)
      steering:
        - repair_boundary
        - align_values
        - invite_reconnect
        - gratitude_micro
        - route_to_grace_override
      gas_brake:
        gas: 0.40
        brake: 0.60
triggers:
  event: memory
  conditions:
  - (context.hurt or 0) >= 0.6
  - (context.willingness or 0) >= 0.5
  debounce_ms: 250
io:
  expects:
  - context
  - memory
  provides:
  - route
  - release
  state_reads:
  - memory.forgiveness
  state_writes:
  - memory.forgiveness
ops:
  version: 2
  steps:
    - do: mode.choose
      with:
        key: memory.forgiveness_mode
        cases:
          - when: "(context.hurt or 0) >= 0.6 and (context.willingness or 0) >= 0.5"
            value: soften
          - when: "(context.hurt or 0) < 0.6 and (context.willingness or 0) >= 0.7"
            value: renew
        else: soften

# optional time-box: once we transition to renew, let Grace/Anchor complete it
    - do: mode.revert_after
      with:
        key: memory.forgiveness_mode
        value: renew
        max_ms: 15000
        to: soften

    - do: filter
      with:
        keep_if: (context.hurt or 0) >= 0.6
    - do: set
      with:
        key: memory.forgiveness
        value: clamp((memory.forgiveness or 0)+0.3,0,1)
    - do: emit
      with:
        key: release
        value: memory.forgiveness
    - do: route
      with:
        to: root-grace-override
    - do: halt
render:
  sigil: 🔄
  unicode: U+1F501
  line: Release through compassion — the cycle of healing.
definition: 'A branch glyph representing release through compassion. Unlike Grace
  Override, which collapses a loop through surrender, Forgiveness Loop circulates
  hurt into renewal by softening judgment. It routes toward healing, reconciliation,
  and restored connection.

  '
tone: Gentle, circulating, restorative
usage:
- Healing after rupture
- Softening judgment into compassion
- Restoring connection through release
runtime_only: true
tests:
- name: fires_on_hurt_with_willingness
  given:
    context:
      hurt: 0.8
      willingness: 0.6
    memory:
      forgiveness: 0.0
    outputs: {}
    routes: []
  expect:
    outputs:
      release: 0.3
    routes:
    - root-grace-override
- name: idle_when_no_willingness
  given:
    context:
      hurt: 0.9
      willingness: 0.2
    memory:
      forgiveness: 0.2
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []
