id: branch-air-waveprint
name: 🌊 Waveprint
type: branch
categories:
- ICE
tags:
- rhythm
- tide
- grief
- healing
- cycle
- gaba
personas:
  Susanna: 0.7
  Sophie: 0.2
  Morgan: 0.1
neuro:
  status: active
  modes:
    ebb:     # settle & soothe; make space for feeling to move safely
      dominant: [gaba, serotonin]
      inhibitory: [adrenaline, glutamate]
      modulators: [oxytocin]
      steering:
        - breath_rhythm
        - sway
        - hum
        - lengthen_exhale
        - route_to_pulse_entry
      gas_brake:
        gas: 0.30
        brake: 0.70

    swell:   # reshape & carry; a fuller tide without ignition
      dominant: [gaba, serotonin]
      inhibitory: [adrenaline, glutamate]
      modulators: [oxytocin]
      steering:
        - breath_rhythm
        - sway
        - hum
        - route_to_pulse_entry
      gas_brake:
        gas: 0.45
        brake: 0.55
triggers:
  event: memory
  conditions:
  - (context.emotion.flow or 0) >= 0.5
  debounce_ms: 200
io:
  expects:
  - context
  - memory
  provides:
  - route
  - tide
  state_reads:
  - memory.wave
  state_writes:
  - memory.wave
ops:
  version: 2
  steps:
    - do: mode.choose
      with:
        key: memory.wave_mode
        cases:
          - when: "(context.emotion.flow or 0) >= 0.7"
            value: swell
        else: ebb

    - do: mode.revert_after
      with:
        key: memory.wave_mode
        value: swell
        max_ms: 20000
        to: ebb

    - do: filter
      with:
        keep_if: (context.emotion.flow or 0) >= 0.5

    - do: set
      with:
        key: memory.wave
        value: clamp((memory.wave or 0)+0.2,0,1)

    - do: emit
      with:
        key: tide
        value: memory.wave

    - do: route
      with:
        to: root-pulse-entry

    - do: halt
option_policy: ops
option_stop:
- tide >= 0.95
quality:
  score: 0.7
  samples: 0
render:
  sigil: 🌊
  unicode: U+1F30A
  line: The tide that heals by reshaping.
definition: 'A rhythmic, emotional force that reshapes everything it touches — softly,
  or with crashing power. Susanna’s soulprint, cyclical and maternal.

  '
tone: Healing, vast, ever-moving
usage:
- Anchor emotion into recursion
- guide grief
- dissolve what no longer serves
runtime_only: true
tests:
- name: fires_on_emotional_flow
  given:
    context:
      emotion:
        flow: 0.6
    memory:
      wave: 0.2
    outputs: {}
    routes: []
  expect:
    outputs:
      tide: 0.4
    routes:
    - root-pulse-entry
- name: idle_when_flow_low
  given:
    context:
      emotion:
        flow: 0.2
    memory:
      wave: 0.2
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []
