id: branch-air-sleepveil
name: 🛌 Sleepveil
type: branch
categories:
- ECF
tags:
- rest
- haze
- unconscious
- gentle
- release
personas:
  Susanna: 0.7
  Sophie: 0.2
  Morgan: 0.1
neuro:
  status: active
  modes:
    doze:    # float-down; lighten the field; escort toward rest
      dominant: [gaba, endorphins]
      inhibitory: [norepinephrine, adrenaline]        # lower arousal & startle
      modulators: [serotonin, oxytocin]               # tone + felt-safety
      steering:
        - dim_lights
        - hush
        - slow_exhale
        - cradle
        - drift
        - route_to_grace_override
      gas_brake:
        gas: 0.40
        brake: 0.60

    sink:    # lights-out; deeper hush when words are exhausted
      dominant: [gaba, endorphins]
      inhibitory: [norepinephrine, adrenaline]        # keep arousal off
      modulators: [serotonin]                          # quiet tone; minimal motion
      steering:
        - weight_blanket
        - mute_thought
        - lengthen_exhale
        - stillness
        - route_to_grace_override
      gas_brake:
        gas: 0.15
        brake: 0.85
triggers:
  event: recursion
  conditions:
  - (context.overload or 0) == 1 and (context.words.exhausted or 0) == 1
  debounce_ms: 300
io:
  expects:
  - context
  - memory
  provides:
  - route
  - rest
  state_reads:
  - memory.sleepveil
  state_writes:
  - memory.sleepveil
ops:
  version: 2
  steps:
    - do: mode.choose
      with:
        key: memory.sleepveil_mode
        cases:
          - when: "(context.overload or 0) == 1 and (context.words.exhausted or 0) == 1"
            value: sink
        else: doze

    # brief doze by default; if sink is selected, keep it short and let Grace complete
    - do: mode.revert_after
      with:
        key: memory.sleepveil_mode
        value: sink
        max_ms: 20000
        to: doze

    # … your existing filter / set / emit / route / halt stay exactly as they are …
    - do: filter
      with:
        keep_if: (context.overload or 0) == 1 and (context.words.exhausted or 0) == 1
    - do: set
      with:
        key: memory.sleepveil
        value: clamp((memory.sleepveil or 0)+0.4,0,1)
    - do: emit
      with:
        key: rest
        value: memory.sleepveil
    - do: route
      with:
        to: root-grace-override
    - do: halt
option_policy: ops
option_stop:
- rest >= 0.9
quality:
  score: 0.7
  samples: 0
render:
  sigil: 🛌
  unicode: U+1F6CC
  line: The haze where silence heals more than words.
definition: 'The comforting haze between conscious pain and unconscious release. Invoked
  when escorting someone out of overload, often at the end of therapeutic spirals
  or after heavy grief loops.

  '
tone: Drowsy, numbing, gentle
usage:
- Escorting out of overload
- silence as healing
- post-grief rest
runtime_only: true
tests:
- name: fires_on_exhaustion
  given:
    context:
      overload: 1
      words:
        exhausted: 1
    memory:
      sleepveil: 0.2
    outputs: {}
    routes: []
  expect:
    outputs:
      rest: 0.6
    routes:
    - root-grace-override
- name: idle_when_not_exhausted
  given:
    context:
      overload: 1
      words:
        exhausted: 0
    memory:
      sleepveil: 0.2
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []
