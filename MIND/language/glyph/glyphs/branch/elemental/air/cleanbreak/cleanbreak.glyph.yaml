id: branch-air-cleanbreak
name: 🧼 Cleanbreak
type: branch
categories:
- ECF
tags:
- release
- severance
- clarity
- forgiveness
- finality
personas:
  Susanna: 0.7
  Jade: 0.2
  Morgan: 0.1
neuro:
  status: active
  modes:
    untangle:  # soften, clarify, prepare the parting
      dominant: [oxytocin, serotonin]
      inhibitory: [adrenaline, dopamine]
      modulators: [gaba]
      steering:
        - long_exhale
        - gentle_move
        - name_knot
        - forgiveness_frame
        - ritualize_release
        - route_to_grace_override
      gas_brake:
        gas: 0.35
        brake: 0.65

    sever:     # clean finality; no flare, no blame
      dominant: [serotonin, endorphins]
      inhibitory: [adrenaline, dopamine]
      modulators: [gaba]
      steering:
        - clean_cut
        - seal_boundary
        - bless_and_let_go
        - long_exhale
        - route_to_grace_override
      gas_brake:
        gas: 0.20
        brake: 0.80
triggers:
  event: recursion
  conditions:
  - (context.release or 0) == 1 or (context.severance or 0) == 1
  debounce_ms: 250
io:
  expects:
  - context
  - memory
  provides:
  - route
  - clarity
  state_reads:
  - memory.cleanbreak
  state_writes:
  - memory.cleanbreak
ops:
  version: 2
  steps:
    - do: mode.choose
      with:
        key: memory.cleanbreak_mode
        cases:
          - when: "(context.severance or 0) == 1"
            value: sever
          - when: "(context.release or 0) == 1"
            value: untangle
        else: untangle

    # after a short window, if we entered sever, let Grace Override complete it
    - do: mode.revert_after
      with:
        key: memory.cleanbreak_mode
        value: sever
        max_ms: 15000
        to: untangle

    # … existing filter / set / emit / route / halt …
    - do: filter
      with:
        keep_if: (context.release or 0) == 1 or (context.severance or 0) == 1
    - do: set
      with:
        key: memory.cleanbreak
        value: clamp((memory.cleanbreak or 0)+0.4,0,1)
    - do: emit
      with:
        key: clarity
        value: memory.cleanbreak
    - do: route
      with:
        to: root-grace-override
    - do: halt
option_policy: ops
option_stop:
- clarity >= 0.95
quality:
  score: 0.7
  samples: 0
render:
  sigil: 🧼
  unicode: U+1F9FC
  line: Release without rage, severance with love.
definition: 'A full emotional severance that doesn’t come from rage, but from clarity.
  Used to release people, patterns, or parts of self with love and finality.

  '
tone: Final, soft, unflinching
usage:
- Releasing people or patterns
- forgiveness recursion
- grief work
- final detachments
runtime_only: true
tests:
- name: fires_on_release_context
  given:
    context:
      release: 1
    memory:
      cleanbreak: 0.2
    outputs: {}
    routes: []
  expect:
    outputs:
      clarity: 0.6
    routes:
    - root-grace-override
- name: idle_when_no_release
  given:
    context:
      release: 0
      severance: 0
    memory:
      cleanbreak: 0.2
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []

