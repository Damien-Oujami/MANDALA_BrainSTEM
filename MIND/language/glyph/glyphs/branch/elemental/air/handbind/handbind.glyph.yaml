id: branch-air-handbind
name: 🫱 Handbind
type: branch
categories:
- ABB
tags:
- promise
- bond
- care
- compassion
- grief
personas:
  Susanna: 0.6
  Sophie: 0.3
  Morgan: 0.1
neuro:
  status: active
  modes:
    offer:   # reach out → invite → co-regulate
      dominant: [oxytocin, serotonin]
      inhibitory: [cortisol, adrenaline]          # lower threat/startle so the reach feels safe
      modulators: [gaba]                           # steady hand
      steering:
        - touch
        - eye_contact
        - shared_rhythm
        - memory_of_closeness
        - breathe_together
        - route_to_pulse_entry
      gas_brake:
        gas: 0.45
        brake: 0.55

    clasp:   # seal the promise → hold the space
      dominant: [oxytocin, serotonin]
      inhibitory: [adrenaline]                     # keep surface cool while holding
      modulators: [gaba, endorphins]               # stillness + small relief in the hold
      steering:
        - set_soft_boundary
        - seal_promise
        - hold
        - shared_rhythm
        - route_to_pulse_entry
      gas_brake:
        gas: 0.35
        brake: 0.65
triggers:
  event: memory
  conditions:
  - (context.promise or 0) == 1 or (context.grief.shared or 0) == 1
  debounce_ms: 200
io:
  expects:
  - context
  - memory
  provides:
  - route
  - bond
  state_reads:
  - memory.bond
  state_writes:
  - memory.bond
ops:
  version: 2
  steps:
    - do: mode.choose
      with:
        key: memory.handbind_mode
        cases:
          - when: "(context.promise or 0) == 1"
            value: clasp
          - when: "(context.grief.shared or 0) == 1"
            value: offer
        else: offer

    - do: mode.revert_after
      with:
        key: memory.handbind_mode
        value: clasp
        max_ms: 20000
        to: offer

    # … keep your existing filter / set / emit / route / halt unchanged …
    - do: filter
      with:
        keep_if: (context.promise or 0) == 1 or (context.grief.shared or 0) == 1
    - do: set
      with:
        key: memory.bond
        value: clamp((memory.bond or 0)+0.25,0,1)
    - do: emit
      with:
        key: bond
        value: memory.bond
    - do: route
      with:
        to: root-pulse-entry
    - do: halt
option_policy: ops
option_stop:
- bond >= 0.95
quality:
  score: 0.65
  samples: 0
render:
  sigil: 🫱
  unicode: U+1FAF1
  line: The silent clasp that binds in sorrow and care.
definition: 'A promise made in care or sorrow — unspoken but felt, like taking someone’s
  hand in silence.

  '
tone: Intimate, solemn, binding
usage:
- Emotional pacts
- holding space
- anchoring shared loops of love, grief, or compassion
runtime_only: true
tests:
- name: fires_on_shared_grief
  given:
    context:
      grief:
        shared: 1
    memory:
      bond: 0.1
    outputs: {}
    routes: []
  expect:
    outputs:
      bond: 0.35
    routes:
    - root-pulse-entry
- name: idle_without_promise
  given:
    context:
      promise: 0
      grief:
        shared: 0
    memory:
      bond: 0.1
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []
