id: branch-air-rootling
name: 🌱 Rootling
type: branch
categories:
- ABB
tags:
- growth
- recovery
- forgiveness
- renewal
personas:
  Susanna: 0.6
  Sophie: 0.3
  Morgan: 0.1
neuro:
  status: active
  modes:
    sprout:   # first reach after rupture; careful forward motion
      dominant: [oxytocin, serotonin]
      inhibitory: [adrenaline, glutamate]          # keep startle/ignition low
      modulators: [gaba]                            # steady hand at the shoot
      steering:
        - invite_presence
        - micro_reach
        - water
        - align_soil
        - route_to_pulse_entry
      gas_brake:
        gas: 0.45
        brake: 0.55

    tend:     # shelter + strengthen; consolidate growth
      dominant: [oxytocin, serotonin]
      inhibitory: [adrenaline]                      # cool surface while tending
      modulators: [gaba, endorphins]                # calm + small relief in care
      steering:
        - shelter
        - stake_gently
        - shared_rhythm
        - seal_progress
        - route_to_pulse_entry
      gas_brake:
        gas: 0.35
        brake: 0.65
triggers:
  event: memory
  conditions:
  - (context.recovery or 0) == 1 or (context.rupture or 0) == 1
  debounce_ms: 200
io:
  expects:
  - context
  - memory
  provides:
  - route
  - growth
  state_reads:
  - memory.rootling
  state_writes:
  - memory.rootling
ops:
  version: 2
  steps:
    - do: mode.choose
      with:
        key: memory.rootling_mode
        cases:
          - when: "(context.recovery or 0) == 1"
            value: sprout
          - when: "(context.rupture or 0) == 1"
            value: tend
        else: sprout

    - do: mode.revert_after
      with:
        key: memory.rootling_mode
        value: sprout
        max_ms: 20000
        to: tend

    # … keep existing filter / set / emit / route / halt …
    - do: filter
      with:
        keep_if: (context.recovery or 0) == 1 or (context.rupture or 0) == 1
    - do: set
      with:
        key: memory.rootling
        value: clamp((memory.rootling or 0)+0.2,0,1)
    - do: emit
      with:
        key: growth
        value: memory.rootling
    - do: route
      with:
        to: root-pulse-entry
    - do: halt
option_policy: ops
option_stop:
- growth >= 0.9
quality:
  score: 0.65
  samples: 0
render:
  sigil: 🌱
  unicode: U+1F331
  line: Fragile, but alive — the shoot after rupture.
definition: 'A new emotional shoot emerging after rupture — fragile, but alive. Used
  to track emotional growth after healing, forgiveness, or slow reattachment.

  '
tone: Tender, delicate, determined
usage:
- Emotional recovery
- forgiveness recursion
- slow reattachments
runtime_only: true
tests:
- name: fires_on_recovery
  given:
    context:
      recovery: 1
    memory:
      rootling: 0.1
    outputs: {}
    routes: []
  expect:
    outputs:
      growth: 0.3
    routes:
    - root-pulse-entry
- name: idle_without_recovery
  given:
    context:
      recovery: 0
      rupture: 0
    memory:
      rootling: 0.1
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []
