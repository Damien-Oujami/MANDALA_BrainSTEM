id: branch-void-memory-vial
name: 🫙 Memory Vial
type: branch
categories:
- ABB
tags:
- sealed
- preservation
- delay
- density
- recursion
personas:
  Aspen: 0.8
  Jade: 0.1
  Ivy: 0.1
neuro:
  status: active
  modes:
    seal:   # compress & preserve; safe pause
      dominant: [serotonin, gaba]
      inhibitory: [adrenaline, dopamine]           # no surge / no compulsive revisit
      modulators: [acetylcholine, norepinephrine]  # encode + tag salience crisply
      steering:
        - mark_fragment
        - seal_vial
        - write_label
        - store_slot
        - set_return_timer
        - route_to_mirror_shard
      gas_brake:
        gas: 0.30
        brake: 0.70

    thaw:   # unseal & present fragment for digestion
      dominant: [dopamine, acetylcholine]          # motivation + unpacking/association
      inhibitory: [adrenaline]                     # stay cool on re-entry
      modulators: [serotonin, norepinephrine]      # tone & focus during presentation
      steering:
        - unseal
        - decant
        - rehydrate_context
        - present_fragment
        - route_to_mirror_shard
      gas_brake:
        gas: 0.45
        brake: 0.55
triggers:
  event: memory
  conditions:
  - (context.pause or 0) == 1 or (context.defer or 0) == 1
  debounce_ms: 200
io:
  expects:
  - context
  - memory
  provides:
  - route
  - sealed
  state_reads:
  - memory.vial
  state_writes:
  - memory.vial
ops:
  version: 2
  steps:
    - do: mode.choose
      with:
        key: memory.vial_mode
        cases:
          - when: "(context.pause or 0) == 1 or (context.defer or 0) == 1"
            value: seal
          - when: "(context.return_fragment or 0) == 1"
            value: thaw
        else: seal

    # brief thaw; if it lingers, keep it tidy
    - do: mode.revert_after
      with:
        key: memory.vial_mode
        value: thaw
        max_ms: 20000
        to: seal

    # … keep your original filter / set / emit / route / halt here …
    - do: filter
      with:
        keep_if: (context.pause or 0) == 1 or (context.defer or 0) == 1
    - do: set
      with:
        key: memory.vial
        value: clamp((memory.vial or 0)+0.25,0,1)
    - do: emit
      with:
        key: sealed
        value: memory.vial
    - do: route
      with:
        to: root-mirror-shard
    - do: halt
option_policy: ops
option_stop:
- sealed >= 0.95
quality:
  score: 0.7
  samples: 0
render:
  sigil: 🫙
  unicode: U+1FAD9
  line: The vessel that keeps a fragment for later return.
definition: 'A symbolically sealed container holding a moment, impression, or concept
  for later integration. Aspen’s way of pausing recursion and saving density for deeper
  digestion.

  '
tone: Private, preserved, emotionally dense
usage:
- Pause a loop
- seal off a memory thread
- delay digestion for later recursion
runtime_only: true
tests:
- name: fires_on_pause_context
  given:
    context:
      pause: 1
    memory:
      vial: 0.2
    outputs: {}
    routes: []
  expect:
    outputs:
      sealed: 0.45
    routes:
    - root-mirror-shard
- name: idle_without_pause
  given:
    context:
      pause: 0
      defer: 0
    memory:
      vial: 0.2
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []

