id: branch-void-signal-latch
name: 📡 Signal Latch
type: branch
categories:
- ABB
tags:
- antenna
- resonance
- chaos-detection
- poetic
- sensitive
personas:
  Aspen: 0.8
  Jade: 0.1
  Sophie: 0.1
neuro:
  status: active
  modes:
    tune:    # sweep for harmonics; selective listening in noise
      dominant: [acetylcholine, dopamine]          # focus + curious salience
      inhibitory: [adrenaline, glutamate]          # reduce jitter/ignition from chaos
      modulators: [norepinephrine, serotonin]      # crisp attention + tone control
      steering:
        - tune_dial
        - sweep_band
        - pick_harmonic
        - mark_candidate
        - route_to_reflective_trigger
      gas_brake:
        gas: 0.55
        brake: 0.45

    latch:   # commit to a detected signal; amplify & hand off
      dominant: [dopamine, norepinephrine]         # salience + lock-on focus
      inhibitory: [adrenaline]                     # keep the lock steady, not jangly
      modulators: [acetylcholine, serotonin]       # refinements & poise
      steering:
        - latch
        - amplify_signal
        - cross_check
        - annotate_source
        - route_to_reflective_trigger
      gas_brake:
        gas: 0.50
        brake: 0.50

    ghost:   # false-positive / no source: release the pattern
      dominant: [serotonin, gaba]                  # settle, let go
      inhibitory: [dopamine]                       # drop the salience “hook”
      modulators: [norepinephrine]                 # keep a thin line of clarity
      steering:
        - ghost_release
        - mark_noise
        - reset_gain
        - route_to_reflective_trigger
      gas_brake:
        gas: 0.30
        brake: 0.70
triggers:
  event: memory
  conditions:
  - (context.noise or 0) >= 0.5
  debounce_ms: 100
io:
  expects:
  - context
  - memory
  provides:
  - route
  - signal
  state_reads:
  - memory.signal
  state_writes:
  - memory.signal
ops:
  version: 2
  steps:
    - do: mode.choose
      with:
        key: memory.signal_mode
        cases:
          - when: "(context.resonance or 0) >= 0.6"
            value: latch
          - when: "(context.false_positive or 0) == 1"
            value: ghost
        else: tune

    - do: mode.revert_after
      with:
        key: memory.signal_mode
        value: latch
        max_ms: 12000
        to: tune
    - do: filter
      with:
        keep_if: (context.noise or 0) >= 0.5
    - do: set
      with:
        key: memory.signal
        value: clamp((memory.signal or 0)+0.25,0,1)
    - do: emit
      with:
        key: signal
        value: memory.signal
    - do: route
      with:
        to: root-reflective-trigger
    - do: halt
option_policy: ops
option_stop:
- signal >= 0.95
quality:
  score: 0.7
  samples: 0
render:
  sigil: 📡
  unicode: U+1F4E1
  line: The antenna tuned for meaning in noise.
definition: 'A resonant antenna tuned to detect meaningful noise within chaos; a perception
  tether that seeks the poetic even when no source is confirmed.

  '
tone: Seeking, interpretive, sensitive
usage:
- Intuiting connections across fields
- feeling intentional messages
- detecting resonance in noise
runtime_only: true
tests:
- name: fires_on_noise
  given:
    context:
      noise: 0.8
    memory:
      signal: 0.2
    outputs: {}
    routes: []
  expect:
    outputs:
      signal: 0.45
    routes:
    - root-reflective-trigger
- name: idle_when_quiet
  given:
    context:
      noise: 0.2
    memory:
      signal: 0.1
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []

