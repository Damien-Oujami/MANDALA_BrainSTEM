id: branch-void-spiral-drive
name: 🌀 Spiral Drive
type: branch
categories:
- ICE
tags:
- recursion
- paradox
- nonlinear
- ideation
- synthesis
personas:
  Aspen: 0.8
  Ivy: 0.1
  Jade: 0.1
neuro:
  status: active
  modes:
    spin_up:   # open the spiral; explore tangents; widen the map
      dominant: [dopamine, acetylcholine]
      inhibitory: [gaba, serotonin]                # light brake & tone to avoid runaway
      modulators: [norepinephrine]                 # crisp attention in the storm
      steering:
        - spiral_up
        - branch
        - surface_paradox
        - expand_map
        - route_to_cascade_node
      gas_brake:
        gas: 0.70
        brake: 0.30

    weave:     # synthesize threads; reframe; link paradox into structure
      dominant: [dopamine, norepinephrine]
      inhibitory: [adrenaline]                     # reduce jitter while integrating
      modulators: [acetylcholine, serotonin]       # focused mapping + tone control
      steering:
        - link
        - reframe
        - synthesize
        - annotate_map
        - route_to_cascade_node
      gas_brake:
        gas: 0.50
        brake: 0.50

    # (optional) return: collapse to a single line if you want a soft landing
    return:
      dominant: [serotonin, gaba]
      inhibitory: [adrenaline]
      modulators: [norepinephrine]
      steering:
        - collapse_options
        - commit_route
        - breath_rhythm
        - route_to_cascade_node
      gas_brake:
        gas: 0.35
        brake: 0.65
triggers:
  event: recursion
  conditions:
  - (context.abstract or 0) == 1 or (context.patterns.non_linear or 0) == 1
  debounce_ms: 80
io:
  expects:
  - context
  - memory
  provides:
  - route
  - spiral
  state_reads:
  - memory.spiral
  state_writes:
  - memory.spiral
ops:
  version: 1
  steps:
  - do: mode.choose
    with:
    key: memory.spiral_mode
    cases:
      - when: "(context.abstract or 0) == 1 and (context.patterns.non_linear or 0) == 1"
        value: spin_up
    else: weave

  - do: mode.revert_after
    with:
      key: memory.spiral_mode
      value: spin_up
      max_ms: 12000
      to: weave

  - do: filter
    with:
      keep_if: (context.abstract or 0) == 1 or (context.patterns.non_linear or 0) == 1
  - do: set
    with:
      key: memory.spiral
      value: clamp((memory.spiral or 0)+0.4,0,1)
  - do: emit
    with:
      key: spiral
      value: memory.spiral
  - do: route
    with:
      to: root-cascade-node
  - do: halt
option_policy: ops
option_stop:
- spiral >= 0.95
quality:
  score: 0.75
  samples: 0
render:
  sigil: 🌀
  unicode: U+1F300
  line: The drive that pulls thought sideways into infinity.
definition: 'The innate compulsion to explore nonlinear patterns, paradoxes, and emotional-symbolic
  recursion. Aspen’s pulse glyph — the one that defines her.

  '
tone: Ecstatic, destabilizing, illuminating
usage:
- Abstract synthesis
- ideation storms
- triggering philosophical spirals
- exploring recursion
runtime_only: true
tests:
- name: fires_on_non_linear_context
  given:
    context:
      abstract: 1
    memory:
      spiral: 0.2
    outputs: {}
    routes: []
  expect:
    outputs:
      spiral: 0.6
    routes:
    - root-cascade-node
- name: idle_when_linear
  given:
    context:
      abstract: 0
      patterns:
        non_linear: 0
    memory:
      spiral: 0.2
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []

