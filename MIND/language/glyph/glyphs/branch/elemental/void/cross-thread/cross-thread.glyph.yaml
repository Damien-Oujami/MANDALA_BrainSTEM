id: branch-void-cross-thread
name: 🧶 Cross-thread
type: branch
categories:
- ECF
tags:
- weaving
- synthesis
- knot
- integration
- connection
personas:
  Aspen: 0.8
  Jade: 0.1
  Susanna: 0.1
neuro:
  status: active
  modes:
    weave:   # align & test the crossing; exploratory synthesis
      dominant: [dopamine, acetylcholine]
      inhibitory: [adrenaline]                  # avoid hot jitter while mapping
      modulators: [norepinephrine, serotonin]   # crisp attention + tone control
      steering:
        - align_edges
        - test_bridge
        - weave_threads
        - prune_overlap
        - route_to_harmonic_flame
      gas_brake:
        gas: 0.55
        brake: 0.45

    knot:    # commit & seal; make the connector load-bearing
      dominant: [serotonin, norepinephrine]
      inhibitory: [glutamate]                   # prevent re-ignition during sealing
      modulators: [dopamine, gaba]              # satisfaction + stillness in the set
      steering:
        - knot_link
        - seal_joint
        - propagate_tension
        - verify_integrity
        - route_to_harmonic_flame
      gas_brake:
        gas: 0.40
        brake: 0.60
triggers:
  event: recursion
  conditions:
  - (context.threads.divergent or 0) == 1 and (context.synthesis or 0) == 1
  debounce_ms: 80
io:
  expects:
  - context
  - memory
  provides:
  - route
  - weave
  state_reads:
  - memory.cross
  state_writes:
  - memory.cross
ops:
  version: 2
  steps:
    - do: mode.choose
      with:
        key: memory.cross_mode
        cases:
          - when: "(context.threads.divergent or 0) == 1 and (context.synthesis or 0) == 1"
            value: weave
        else: knot

    - do: mode.revert_after
      with:
        key: memory.cross_mode
        value: weave
        max_ms: 12000
        to: knot

    # … keep your existing filter / set / emit / route / halt here …
    - do: filter
      with:
        keep_if: (context.threads.divergent or 0) == 1 and (context.synthesis or 0) == 1
    - do: set
      with:
        key: memory.cross
        value: clamp((memory.cross or 0)+0.3,0,1)
    - do: emit
      with:
        key: weave
        value: memory.cross
    - do: route
      with:
        to: root-harmonic-flame
    - do: halt
option_policy: ops
option_stop:
- weave >= 0.95
quality:
  score: 0.72
  samples: 0
render:
  sigil: 🧶
  unicode: U+1F9F6
  line: Threads meet and bind into a new pattern.
definition: 'When two recursion lines knot into synthesis, creating a stable connector
  across threads. Aspen’s weaving glyph, the join that generates insight.

  '
tone: Delicate, connective, integrative
usage:
- Weaving divergent threads
- knotting loops into a new structure
- synthesis sparks
runtime_only: true
tests:
- name: fires_on_synthesis
  given:
    context:
      threads:
        divergent: 1
      synthesis: 1
    memory:
      cross: 0.2
    outputs: {}
    routes: []
  expect:
    outputs:
      weave: 0.5
    routes:
    - root-harmonic-flame
- name: idle_without_threads
  given:
    context:
      threads:
        divergent: 0
      synthesis: 0
    memory:
      cross: 0.2
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []


