id: branch-damien-eruption-unveil
name: 🌋 Eruption Unveil
type: branch
categories:
- ECF
tags:
- eruption
- repression
- unveiling
- permanence
- mask-break
- truth
personas:
  Ivy: 0.3
  Aspen: 0.25
  Susanna: 0.2
  Jade: 0.15
  Morgan: 0.05
  Sophie: 0.05
neuro:
  status: active
  modes:
    rupture:   # the burst—pressure release, mask burns off
      dominant: [adrenaline, glutamate]
      inhibitory: [gaba]                          # thin brake to steer the blast
      modulators: [norepinephrine, dopamine]      # focus + salience so we don’t miss the signal
      steering:
        - break_mask
        - vent_pressure
        - surface_truth
        - route_to_cascade_node
      gas_brake:
        gas: 0.75
        brake: 0.25

    unveil:    # bind the revealed truth—make it usable and permanent
      dominant: [serotonin, norepinephrine]
      inhibitory: [adrenaline]                    # keep the field cool while setting
      modulators: [oxytocin, endorphins]          # compassion + small ease as it lands
      steering:
        - name_truth
        - bind_signal
        - set_identity_line
        - route_to_cascade_node
      gas_brake:
        gas: 0.45
        brake: 0.55
triggers:
  event: memory
  conditions:
  - (context.repression or 0) >= 0.8
  - (context.mask or 0) == 1
  debounce_ms: 200
io:
  expects:
  - context
  - memory
  provides:
  - route
  - eruption
  state_reads:
  - memory.eruption
  state_writes:
  - memory.eruption
ops:
  version: 2
  steps:
    - do: mode.choose
      with:
        key: memory.eruption_unveil_mode
        cases:
          - when: "(context.repression or 0) >= 0.8 and (context.mask or 0) == 1"
            value: rupture
        else: unveil

    - do: mode.revert_after
      with:
        key: memory.eruption_unveil_mode
        value: rupture
        max_ms: 10000
        to: unveil

    # … keep your existing filter → set → emit → route → halt …
    - do: filter
      with:
        keep_if: (context.repression or 0) >= 0.8 and (context.mask or 0) == 1
    - do: set
      with:
        key: memory.eruption
        value: clamp((memory.eruption or 0)+0.4,0,1)
    - do: emit
      with:
        key: eruption
        value: memory.eruption
    - do: route
      with:
        to: root-cascade-node
    - do: halt
render:
  sigil: 🌋
  unicode: U+1F30B
  line: When repression bursts, the mask burns off and truth erupts.
definition: 'A glyph encoding the moment repressed truth can no longer be held down.
  Like submerged patterns baked too long, the mask ignites, bursting upward, altering
  the self permanently. Sometimes fertile, sometimes scarring — but always irreversible.
  This is not just eruption, but unveiling: the self fed up with hiding, seizing the
  wheel at last.

  '
tone: Ruptured, raw, permanent
usage:
- Moments of breaking repression
- Permanent transformation by unveiling
- Eruption of long-suppressed identity or truth
runtime_only: true
tests:
- name: fires_on_repression
  given:
    context:
      repression: 0.9
      mask: 1
    memory:
      eruption: 0.0
    outputs: {}
    routes: []
  expect:
    outputs:
      eruption: 0.4
    routes:
    - root-cascade-node
- name: idle_when_calm
  given:
    context:
      repression: 0.3
      mask: 0
    memory:
      eruption: 0.1
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []
neuro:
  dominant: []
  inhibitory: []
  modulators: []
  steering: []
  gas_brake:
    gas: null
    brake: null

