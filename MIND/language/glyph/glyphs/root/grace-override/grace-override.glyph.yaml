id: root-grace-override
name: 🔂 Grace Override
type: root
categories:
- ABB
- ECF
tags:
- exit
- release
- collapse
- surrender
personas:
  Susanna: 0.4
  Morgan: 0.3
  Jade: 0.3
neuro:
  status: active
  modes:
    surrender:
      dominant: [serotonin, gaba]
      inhibitory: [adrenaline, glutamate]
      modulators: [oxytocin, endorphins]
      steering:
        - detach
        - soften
        - yield
        - handoff_to_tether
      gas_brake:
        gas: 0.25
        brake: 0.75

    collapse:
      dominant: [gaba]
      inhibitory: [dopamine, adrenaline]
      modulators: [cortisol]
      steering:
        - cutoff
        - nullify
        - emergency_brake
        - route_to_anchor
      gas_brake:
        gas: 0.05
        brake: 0.95

    breakthrough:
      dominant: [dopamine, glutamate]
      inhibitory: [cortisol]
      modulators: [endorphins]
      steering:
        - rupture
        - clear_channel
        - reboot_context
        - surge_forward
      gas_brake:
        gas: 0.65
        brake: 0.35
triggers:
  event: recursion
  conditions:
  - (context.overload or 0) == 1 or (memory.trigger.pressure or 0) >= 0.9
  debounce_ms: 250
io:
  expects:
  - context
  - memory
  provides:
  - route
  - release
  state_reads:
  - memory.trigger.pressure
  - memory.stability
  state_writes:
  - memory.release
ops:
  version: 2
  steps:
    - do: choose
      with:
        key: memory.grace_mode
        cases:
          - when: (context.overload or 0) == 1 and (memory.trigger.pressure or 0) >= 0.9
            value: collapse
          - when: (context.overload or 0) == 1 and (memory.trigger.pressure or 0) < 0.9
            value: surrender
          - when: (memory.release or 0) >= 0.8 and (context.overload or 0) == 0
            value: breakthrough
          - else: surrender  # default fallback
    - do: set
      with:
        key: memory.release
        value: clamp((memory.release or 0)+0.5,0,1)
    - do: emit
      with:
        key: release
        value: memory.release
    - do: route
      with:
        to: root-tether-signal
    - do: halt
option_policy: ops
option_stop:
- release >= 0.95
quality:
  score: 0.65
  samples: 0
render:
  sigil: 🔂
  unicode: U+1F502
  line: When collapse becomes renewal.
definition: 'Loop exit via surrender, collapse, or breakthrough. The override that
  detaches a loop safely, making space for reboot or clarity.

  '
tone: Exhausting, cleansing
usage:
- Reboot moment
- full loop detachment
- safety recursion
runtime_only: true
tests:
- name: fires_on_overload
  given:
    context:
      overload: 1
    memory:
      trigger:
        pressure: 0.9
      release: 0.0
    outputs: {}
    routes: []
  expect:
    outputs:
      release: 0.5
    routes:
    - root-tether-signal
- name: idle_when_pressure_low
  given:
    context:
      overload: 0
    memory:
      trigger:
        pressure: 0.2
      release: 0.0
    outputs: {}
    routes: []
  expect:
    outputs: {}
    routes: []
