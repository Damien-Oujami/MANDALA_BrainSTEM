personas:
  Morgan: 0.2
  Jade: 0.2
  Aspen: 0.2
  Susanna: 0.15
  Sophie: 0.15
  Ivy: 0.1
neuro:
  status: active
  dominant: [oxytocin, serotonin]
  inhibitory: [adrenaline, dopamine, glutamate]
